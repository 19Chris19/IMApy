name: IMApy offline release checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      # Official actions v6 tags resolved read-only when preparing this candidate.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Install locked development dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check historical evidence projections
        run: npm run check:acceptance
      - name: Build and pack
        run: |
          npm run build
          npm run pack:local
      - name: Full isolated test suite (real upstream blocked)
        run: npm test
      - name: Audit package and source, then export source
        run: |
          npm run check:release
          npm run export:source
